<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 页面更新提醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .alert-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 32px 24px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            color: #d93025;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .url {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 8px;
            word-break: break-all;
            max-height: 40px;
            overflow: hidden;
        }

        .message {
            color: #202124;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .timestamp {
            color: #80868b;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
        }

        .btn-secondary {
            background: #f1f3f4;
            color: #5f6368;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }
    </style>
</head>

<body>
    <div class="alert-container">
        <div class="icon">🚨</div>
        <h1>页面已更新</h1>
        <div class="url" id="url">正在加载...</div>
        <div class="message">检测到变化！</div>
        <div class="timestamp" id="timestamp"></div>
        <div class="buttons">
            <button class="btn-primary" id="openBtn">打开页面</button>
            <button class="btn-secondary" id="closeBtn">知道了</button>
        </div>
    </div>

    <script>
        // 从 URL 参数获取信息
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url') || '未知页面';
        const name = params.get('name') || url;

        // 显示信息
        document.getElementById('url').textContent = name;
        document.getElementById('timestamp').textContent = new Date().toLocaleString('zh-CN');

        // 打开页面按钮
        document.getElementById('openBtn').addEventListener('click', () => {
            chrome.tabs.create({ url: url, active: true });
            window.close();
        });

        // 关闭按钮
        document.getElementById('closeBtn').addEventListener('click', () => {
            window.close();
        });

        // ESC 键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });

        // 5秒后自动聚焦到"打开页面"按钮
        setTimeout(() => {
            document.getElementById('openBtn').focus();
        }, 100);
    </script>
</body>

</html>
