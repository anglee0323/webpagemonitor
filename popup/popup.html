<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区块链页面监控器</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🔍 页面监控器</h1>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">未监控</span>
      </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings">
      <h3>⚙️ 设置</h3>

      <div class="setting-item">
        <label for="intervalSelect">监控频率:</label>
        <select id="intervalSelect" class="select-field">
          <option value="5">极速 (5秒) ⚡</option>
          <option value="10" selected>快速 (10秒) 推荐</option>
          <option value="30">标准 (30秒)</option>
          <option value="60">节能 (60秒)</option>
        </select>
      </div>

      <div class="setting-item checkbox-item">
        <label>
          <input type="checkbox" id="soundEnabled" checked>
          <span>🔊 声音提醒</span>
        </label>
      </div>

      <!-- 声音类型选择 -->
      <div class="setting-item" id="soundTypeContainer">
        <label for="soundType" style="margin-left: 24px;">提示音:</label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <select id="soundType" class="select-field" style="min-width: 90px;">
            <option value="chime" selected>门铃</option>
            <option value="success">成功</option>
            <option value="alert">警报</option>
            <option value="beep">传统</option>
          </select>
          <select id="soundDuration" class="select-field" style="min-width: 60px;">
            <option value="1">1秒</option>
            <option value="3" selected>3秒</option>
            <option value="5">5秒</option>
            <option value="10">10秒</option>
            <option value="20">20秒</option>
          </select>
          <button id="testSound" class="btn-small btn-success" title="试听">▶</button>
        </div>
      </div>

      <div class="setting-item checkbox-item">
        <label>
          <input type="checkbox" id="autoOpen">
          <span>🚀 检测到变化自动打开页面</span>
        </label>
      </div>

      <div class="setting-item checkbox-item">
        <label>
          <input type="checkbox" id="popupAlert">
          <span>📢 浏览器弹窗提醒</span>
        </label>
      </div>
    </div>

    <!-- 添加监控表单 -->
    <div class="add-section">
      <h3>添加监控URL</h3>
      <div class="form-group">
        <input type="text" id="urlInput" placeholder="输入要监控的网页URL" class="input-field">
        <input type="text" id="nameInput" placeholder="页面名称(可选)" class="input-field">
        <button id="addUrl" class="btn btn-add">+ 添加</button>
      </div>
    </div>

    <!-- 监控列表 -->
    <div class="monitor-list">
      <h3>监控列表 (<span id="monitorCount">0</span>)</h3>
      <div class="empty-state" id="emptyState">
        <p>还没有监控任何页面</p>
        <p class="hint">添加URL开始监控</p>
      </div>
      <div id="monitorItems" class="monitor-items">
        <!-- 动态填充 -->
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
